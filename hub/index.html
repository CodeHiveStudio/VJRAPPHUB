 $('q').hidden=all.length<7;
 all.filter(function(a){return !q||(a.name+' '+(a.desc||'')).toLowerCase().indexOf(q)>=0}).forEach(function(a,i){
  var el=document.createElement('a');el.className='card';el.href='#';el.style.setProperty('--c',a.color||PAL[i%PAL.length]);
  var ic=document.createElement('span');ic.className='ic';ic.innerHTML='<svg viewBox="0 0 64 64">'+(G[a.icon]||G.hub)+'</svg>';
  var d=document.createElement('div'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=a.name;p.textContent=a.desc||'';d.appendChild(h);d.appendChild(p);
  el.appendChild(ic);el.appendChild(d);el.onclick=function(e){e.preventDefault();open_(a)};grid.appendChild(el)});
 if(!grid.children.length){var e=document.createElement('p');e.textContent=q?'ไม่พบระบบที่ค้นหา':'ยังไม่มีระบบในรายการ';grid.appendChild(e)}}
function head(t,s){if(t)$('ttl').textContent=t;if(s)$('sub').textContent=s}
function load(){var api=String(C.apiUrl||'').trim();
 if(!api){render(C.fallback||[]);note('ยังไม่ได้ตั้งค่า apiUrl ใน config.js — แสดงรายการสำรอง');return}
 $('adm').href=api+(api.indexOf('?')<0?'?':'&')+'page=admin';$('adm').hidden=false;
 fetch(api+(api.indexOf('?')<0?'?':'&')+'action=list&t='+Date.now()).then(function(r){return r.json()}).then(function(d){
  if(!d||!d.ok)throw new Error('bad');store(d);head(d.title,d.subtitle);note('');render(d.apps)
 }).catch(function(){var c=store();if(c&&c.apps){head(c.title,c.subtitle);render(c.apps);note('เชื่อมต่อไม่ได้ — แสดงรายการล่าสุดที่บันทึกไว้')}else{render(C.fallback||[]);note('เชื่อมต่อไม่ได้ — แสดงรายการสำรอง')}})}
$('q').oninput=function(){render(all)};$('rf').onclick=load;
document.addEventListener('visibilitychange',function(){if(!document.hidden&&$('viewer').hidden)load()});
var c0=store();if(c0&&c0.apps){head(c0.title,c0.subtitle);render(c0.apps)}else{grid.innerHTML='<div class="sk"></div><div class="sk"></div>'}
load();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();</script></body></html>
