<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ระบบลาออนไลน์</title><meta name="theme-color" content="#ff9f9f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ระบบลา"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;height:100%}
:root{--bg:#ff9f9f;--a2:#ffe66d;--ink:#111;color-scheme:light}
body{background:var(--bg);color:var(--ink);font-family:'Prompt','Noto Sans Thai Looped',system-ui,sans-serif;overflow-x:hidden}
body::after{content:"";position:fixed;width:130px;height:130px;border:3px solid #111;border-radius:50%;background:var(--a2);right:-40px;bottom:-36px;z-index:0}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.screen .gl{width:min(46vw,190px);height:auto;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-6px)}}
h1{font-size:23px;margin:0;font-weight:800;background:#fff;border:3px solid #111;border-radius:14px;padding:6px 16px;box-shadow:4px 4px 0 #111}
p{margin:0;font-size:15px;line-height:1.7;max-width:340px;font-weight:500}
.bar{width:160px;height:14px;border-radius:99px;background:#fff;overflow:hidden;border:3px solid #111}.bar i{display:block;width:40%;height:100%;background:#ff6b6b;border-right:3px solid #111;animation:sw 1.2s linear infinite}
@keyframes sw{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
button{font:inherit;font-weight:800;color:#111;background:var(--a2);border:3px solid #111;border-radius:14px;padding:10px 24px;box-shadow:4px 4px 0 #111;cursor:pointer}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #111}
:focus-visible{outline:3px solid #111;outline-offset:3px}
#app{position:fixed;inset:0;z-index:2;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);background:#fff}
code{background:#fff;border:2px solid #111;border-radius:6px;padding:0 6px}
@media (prefers-reduced-motion:reduce){.gl,.bar i{animation:none}}</style></head><body>
<div class="screen" id="loading"><svg class="gl" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="12" width="48" height="44" rx="9" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M8 25h48v-4a9 9 0 0 0-9-9H17a9 9 0 0 0-9 9z" fill="#ff6b6b" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M20 7v10M44 7v10" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="24" cy="38" r="2.4" fill="#111"/><circle cx="40" cy="38" r="2.4" fill="#111"/><ellipse cx="17" cy="44" rx="4" ry="2.6" fill="#ffb3b3"/><ellipse cx="47" cy="44" rx="4" ry="2.6" fill="#ffb3b3"/><path d="M28 44q4 4 8 0" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/></svg><h1>ระบบลาออนไลน์</h1><p>กำลังเปิดระบบ รอสักครู่นะ</p><div class="bar"><i></i></div></div>
<div class="screen" id="offline" hidden><svg class="gl" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="12" width="48" height="44" rx="9" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M8 25h48v-4a9 9 0 0 0-9-9H17a9 9 0 0 0-9 9z" fill="#ff6b6b" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M20 7v10M44 7v10" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="24" cy="38" r="2.4" fill="#111"/><circle cx="40" cy="38" r="2.4" fill="#111"/><ellipse cx="17" cy="44" rx="4" ry="2.6" fill="#ffb3b3"/><ellipse cx="47" cy="44" rx="4" ry="2.6" fill="#ffb3b3"/><path d="M28 44q4 4 8 0" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/></svg><h1>ไม่มีอินเทอร์เน็ต</h1><p>ระบบนี้ต้องใช้อินเทอร์เน็ต ตรวจสอบสัญญาณแล้วลองใหม่</p><button type="button" onclick="location.reload()">ลองอีกครั้ง</button></div>
<div class="screen" id="setup" hidden><svg class="gl" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="12" width="48" height="44" rx="9" fill="#fff" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M8 25h48v-4a9 9 0 0 0-9-9H17a9 9 0 0 0-9 9z" fill="#ff6b6b" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M20 7v10M44 7v10" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="24" cy="38" r="2.4" fill="#111"/><circle cx="40" cy="38" r="2.4" fill="#111"/><ellipse cx="17" cy="44" rx="4" ry="2.6" fill="#ffb3b3"/><ellipse cx="47" cy="44" rx="4" ry="2.6" fill="#ffb3b3"/><path d="M28 44q4 4 8 0" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/></svg><h1>ยังไม่ได้ใส่ลิงก์ระบบ</h1><p>เปิดไฟล์ <code>config.js</code> แล้ววางลิงก์ Web App ของ Google Apps Script (ลงท้ายด้วย <code>/exec</code>)</p></div>
<script src="config.js"></script><script>(function(){
var u=String(window.LMS_APP_URL||'').trim(),show=function(i){['loading','offline','setup'].forEach(function(x){document.getElementById(x).hidden=x!==i})};
if(!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(u)){show('setup');return}
if(!navigator.onLine){show('offline')}else{var f=document.createElement('iframe');f.id='app';f.title='ระบบลาออนไลน์';f.allow='clipboard-write';f.src=u;f.addEventListener('load',function(){document.getElementById('loading').hidden=true});document.body.appendChild(f)}
window.addEventListener('online',function(){if(!document.getElementById('app'))location.reload()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});})();</script></body></html>
